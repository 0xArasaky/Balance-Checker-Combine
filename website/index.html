<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#010101">
    <meta name="apple-mobile-web-app-title" content="Balance">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Balance Checker Combine">
    <meta name="msapplication-TileColor" content="#010101">
    <title>Balance Checker Combine</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.ico?v=1.3.0" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=1.3.0">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=1.3.0">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=1.3.0">
    <link rel="stylesheet" href="css/style.css?v=1.3.0">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <!-- Левые декоративные элементы -->
            <div class="header-decoration left">
                <div class="decoration-line vertical"></div>
                <div class="decoration-line horizontal"></div>
                <div class="decoration-line vertical bottom"></div>
                <div class="decoration-line horizontal bottom"></div>
            </div>

            <!-- Заголовок -->
            <h1 class="title scramble-text" data-text="Balance Checker Combine">Balance Checker<br>Combine</h1>

            <!-- Правые декоративные элементы -->
            <div class="header-decoration right">
                <div class="decoration-line vertical"></div>
                <div class="decoration-line horizontal"></div>
                <div class="decoration-line vertical bottom"></div>
                <div class="decoration-line horizontal bottom"></div>
            </div>

            <!-- Версия -->
            <span class="version scramble-text" data-text="1.3.0">1.3.0</span>
        </header>

        <!-- История балансов -->
        <section class="history-section balance-history" id="historySection" hidden>
            <div class="balance-history__toolbar">
                <div class="balance-history-range" id="historyRangeToggle" aria-label="Balance history range">
                    <div class="balance-history-range__slider" id="historyRangeSlider"></div>
                    <button class="balance-history-range__btn" data-range="7d" type="button">7D</button>
                    <button class="balance-history-range__btn balance-history-range__btn--active" data-range="30d" type="button">30D</button>
                    <button class="balance-history-range__btn" data-range="1y" type="button">1Y</button>
                    <button class="balance-history-range__btn" data-range="all" type="button">All</button>
                </div>
            </div>
            <div class="balance-history-card">
                <div class="balance-history-card__canvas-wrapper" id="historyChart">
                    <canvas class="balance-history-canvas" id="historyCanvas"></canvas>
                    <div class="balance-history-dot" id="historyChartDot"></div>
                    <div class="balance-history-tooltip" id="historyChartTooltip">
                        <span class="balance-history-tooltip__value">$0</span>
                        <span class="balance-history-tooltip__date"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Выбор данных по датам -->
        <div class="data-selector-wrapper">
            <button class="data-selector-btn" id="dataSelectorBtn">
                <span class="data-selector-date" id="currentDate">Loading...</span>
                <div class="data-selector-right">
                    <span class="data-selector-balance" id="currentBalance">$0</span>
                    <svg class="data-selector-arrow" width="15" height="8" viewBox="0 0 15 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="1.6" height="1.6" fill="#808080"/>
                        <rect x="1.60004" y="1.60001" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="3.20001" y="3.20001" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="4.79999" y="4.79999" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="6.40002" y="6.39999" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="8" y="4.79999" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="9.60004" y="3.20001" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="11.2" y="1.60001" width="1.6" height="1.6" fill="#808080"/>
                        <rect x="12.8" width="1.6" height="1.6" fill="#808080"/>
                    </svg>
                </div>
            </button>

            <!-- Выпадающий список -->
            <div class="data-selector-dropdown" id="dataDropdown">
                <div class="dropdown-list" id="dropdownList">
                    <!-- Список будет заполнен через JS -->
                </div>
            </div>
        </div>

        <!-- Самые крупные источники -->
        <section class="top-sources-section" id="topSourcesSection" hidden>
            <h2 class="section-title">Top</h2>
            <div class="top-sources-list" id="topSourcesList">
                <!-- Будет заполнено через JS -->
            </div>
        </section>

        <!-- Total Stats -->
        <section class="total-stats">
            <!-- Categories Section -->
            <div class="categories-section">
                <h2 class="section-title">Categories</h2>
                <div class="categories-list" id="categoriesList">
                    <!-- Будет заполнено через JS -->
                </div>
            </div>

            <!-- Tokens Section -->
            <div class="tokens-section">
                <h2 class="section-title">Tokens</h2>
                <div class="tokens-list" id="tokensList">
                    <!-- Будет заполнено через JS -->
                </div>
            </div>

            <!-- Wallet Groups Section -->
            <div class="wallet-groups-section" id="walletGroupsSection">
                <!-- Будет заполнено через JS -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="main-footer">
            <!-- Левые декоративные элементы -->
            <div class="footer-decoration left">
                <div class="decoration-line vertical"></div>
                <div class="decoration-line horizontal"></div>
                <div class="decoration-line vertical bottom"></div>
                <div class="decoration-line horizontal bottom"></div>
            </div>

            <!-- Текст автора -->
            <span class="author-text scramble-text" data-text="by Arasaky.eth">by Arasaky.eth</span>

            <!-- Социальные сети -->
            <div class="social-links">
                <a href="https://x.com/0xArasaky" target="_blank" rel="noopener noreferrer" class="social-link">
                    <img src="assets/x.png" alt="X (Twitter)">
                </a>
                <a href="https://github.com/0xArasaky" target="_blank" rel="noopener noreferrer" class="social-link">
                    <img src="assets/github.png" alt="GitHub">
                </a>
                <a href="https://t.me/Arasaky0x" target="_blank" rel="noopener noreferrer" class="social-link">
                    <img src="assets/telegram.png" alt="Telegram">
                </a>
            </div>

            <!-- Правые декоративные элементы -->
            <div class="footer-decoration right">
                <div class="decoration-line vertical"></div>
                <div class="decoration-line horizontal"></div>
                <div class="decoration-line vertical bottom"></div>
                <div class="decoration-line horizontal bottom"></div>
            </div>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-text">Loading<span class="loading-cursor"></span></div>
        </div>
    </div>

    <script src="js/main.js?v=1.3.0"></script>
</body>
</html>
